<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porque — iniciativa</title>
<meta name="description" content="Página pública de una iniciativa.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<a class="salto" href="#contenido">Saltar al contenido</a>
<header class="barra">
  <div class="contenedor">
    <p class="marca"><a href="/">Porque</a></p>
    <nav aria-label="Principal">
      <a href="/#explorar">Explorar</a>
      <a href="/panel">Entrar</a>
      <a class="destacado" href="/panel?a=registro">Crear iniciativa</a>
    </nav>
  </div>
</header>

<main id="contenido" class="contenedor">
  <p class="aviso-demo">Demostración</p>
  <div id="iniciativa" aria-live="polite"><p>Cargando…</p></div>

  <div id="consulta" hidden>
    <h2>Preparar consulta</h2>
    <p id="consulta-producto"></p>
    <button id="btn-copiar" class="big">Copiar enlace</button>
    <button id="btn-chat" class="big">Abrir chat</button>
    <p class="nota">Abrir un chat no confirma envío, recepción ni aceptación.</p>
    <p id="consulta-estado" role="status"></p>
  </div>
</main>

<footer><div class="contenedor"><p>Porque — porque somos panas · <a href="/#explorar">Explorar</a></p></div></footer>
<script type="module">
const WA_TEMPLATE = 'https://wa.me/?text={text}'; // formato por verificar oficialmente
const MODALIDAD = { donations: 'Donaciones', business: 'Negocio', both: 'Ambas' };
const main = document.getElementById('iniciativa');

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function idDeRuta() {
  const m = location.pathname.match(/^\/i\/([A-Za-z0-9-]+)\/?$/);
  if (m) return m[1];
  return new URLSearchParams(location.search).get('id');
}
function metaUSD(cents) {
  if (!Number.isInteger(cents)) return '';
  return `<p class="meta"><strong>Meta:</strong> $${(cents / 100).toFixed(2)} USD</p>
    <p class="nota">La meta es solo una meta pública. No son fondos recaudados.</p>`;
}
function visualInit(init) {
  if (init.imageRef) {
    return `<figure><img src="${escapeHtml(init.imageRef)}" alt="Imagen ilustrativa de la iniciativa"><figcaption>${init.imageAi ? '<span class="etiqueta-ia">Imagen ilustrativa generada con IA</span>' : ''}</figcaption></figure>`;
  }
  const letra = String(init.name ?? '?').trim().charAt(0).toUpperCase() || '?';
  return `<div class="visual-alt" role="img" aria-label="Ilustración decorativa">${escapeHtml(letra)}</div>`;
}
function cardProducto(p) {
  const precio = Number.isInteger(p.priceCents) ? `<p class="precio">$${(p.priceCents / 100).toFixed(2)} USD</p>` : '';
  return `<article class="ficha">
    <h3>${escapeHtml(p.name)}</h3>
    ${precio}
    <p>${escapeHtml(p.description || '')}</p>
    ${p.imageAi ? '<p><span class="etiqueta-ia">Imagen ilustrativa generada con IA</span></p>' : ''}
    <button class="big" data-consulta="${escapeHtml(p.id)}" data-nombre="${escapeHtml(p.name)}">Consultar</button>
  </article>`;
}
function vista(init) {
  const modalidad = MODALIDAD[init.modality] ?? 'Sin definir';
  const productos = Array.isArray(init.products) ? init.products : [];
  const esNegocio = init.modality === 'business';
  const esDonaciones = init.modality === 'donations';
  const muestraProposito = !esNegocio && init.purpose;
  const muestraCatalogo = !esDonaciones;
  return `<div class="pagina-init">
    <article aria-labelledby="init-nombre">
      <h1 id="init-nombre">${escapeHtml(init.name ?? 'Iniciativa sin nombre')}</h1>
      <p><span class="etiqueta-modalidad">${escapeHtml(modalidad)}</span></p>
      ${init.ownerName ? `<p class="nota">Publicada por ${escapeHtml(init.ownerName)}.</p>` : ''}
      ${visualInit(init)}
      ${init.description ? `<p>${escapeHtml(init.description)}</p>` : ''}
      ${muestraProposito ? `<h2>Propósito</h2><p>${escapeHtml(init.purpose)}</p>` : ''}
      ${esDonaciones || init.modality === 'both' ? metaUSD(init.goalCents) : ''}
      ${muestraCatalogo ? (productos.length
        ? `<h2>Productos y servicios</h2><div class="productos">${productos.map(cardProducto).join('')}</div>`
        : '<p class="nota">Esta iniciativa aún no tiene productos públicos.</p>') : ''}
    </article>
    <div class="lateral-init">
      <section class="tarjeta" aria-labelledby="apoyar-titulo">
        <h2 id="apoyar-titulo">Apoyar</h2>
        <div id="apoyos" data-id="${escapeHtml(init.id ?? '')}" data-modality="${escapeHtml(init.modality ?? '')}">
          <p class="nota">Cargando formas de apoyo…</p>
        </div>
      </section>
      <section class="tarjeta" aria-labelledby="compartir-titulo">
        <h2 id="compartir-titulo">Compartir</h2>
        <p id="url-canonica" class="nota"></p>
        <button id="btn-copiar-url" class="big">Copiar la dirección de esta página</button>
        <p id="url-estado" role="status"></p>
        <div id="qr-box"><p class="nota" id="qr-nota">QR descargable: pendiente (se habilita con la dirección pública verificada).</p></div>
      </section>
    </div>
  </div>`;
}
const KIND_LABEL = { intent: 'Intención de apoyo', simulated: 'Simulación' };
function parseMontoUSD(text) {
  const t = String(text ?? '').trim().replace(',', '.');
  if (!t) return { value: null };
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return { error: 'Monto inválido: usa un número en USD, p. ej. 10 o 25.50' };
  const cents = Math.round(Number(t) * 100);
  if (!Number.isSafeInteger(cents) || cents < 1 || cents > 100000000) {
    return { error: 'Monto inválido: debe ser mayor que 0 USD' };
  }
  return { value: cents };
}
function resumenTexto(j) {
  if (!j || j.ok !== true) return null;
  const n = (v) => Number.isInteger(v) ? v : 0;
  return `${n(j.intents)} intenciones expresadas · ${n(j.simulated)} simulaciones de demostración. No son fondos ni dinero recibido.`;
}
async function cargarResumen(id) {
  const el = document.getElementById('apoyos-resumen');
  if (!el) return;
  try {
    const r = await fetch(`/api/initiatives/${encodeURIComponent(id)}/supports/summary`);
    const j = await r.json();
    el.textContent = r.ok && j?.ok ? (resumenTexto(j) ?? 'Resumen no disponible por ahora.') : 'Resumen no disponible por ahora. Inténtalo de nuevo más tarde.';
  } catch {
    el.textContent = 'Resumen no disponible por ahora. Revisa tu conexión e inténtalo de nuevo.';
  }
}
function formularioApoyo(kind, titulo, explicacion, confirmacion) {
  return `<form id="form-${kind}" class="apoyo-form" novalidate>
    <h3>${titulo}</h3>
    <p class="nota">${explicacion}</p>
    <label>Monto en USD (opcional) <input name="monto" inputmode="decimal" placeholder="10" autocomplete="off"></label>
    <label>Apodo (opcional, se muestra al dueño) <input name="apodo" maxlength="60" autocomplete="nickname"></label>
    <label>Mensaje (opcional) <textarea name="mensaje" rows="2" maxlength="500"></textarea></label>
    <label class="confirm"><input type="checkbox" name="confirma" required> ${confirmacion}</label>
    <button type="submit" class="big">Confirmar: ${titulo.toLowerCase()}</button>
    <p id="estado-${kind}" role="status"></p>
  </form>`;
}
async function enviarApoyo(kind, id, form) {
  const estado = document.getElementById(`estado-${kind}`);
  const monto = parseMontoUSD(form.monto.value);
  if (monto.error) { estado.textContent = monto.error; form.monto.focus(); return; }
  const apodo = String(form.apodo.value ?? '').trim();
  const mensaje = String(form.mensaje.value ?? '').trim();
  if (apodo.length > 60) { estado.textContent = 'Apodo inválido: máximo 60 caracteres.'; form.apodo.focus(); return; }
  if (mensaje.length > 500) { estado.textContent = 'Mensaje inválido: máximo 500 caracteres.'; form.mensaje.focus(); return; }
  if (!form.confirma.checked) { estado.textContent = 'Marca la confirmación para continuar.'; form.confirma.focus(); return; }
  estado.textContent = 'Enviando…';
  const cuerpo = { kind, clientOpId: crypto.randomUUID() };
  if (monto.value !== null) cuerpo.amountCents = monto.value;
  if (apodo) cuerpo.nickname = apodo;
  if (mensaje) cuerpo.message = mensaje;
  let r;
  try {
    r = await fetch(`/api/initiatives/${encodeURIComponent(id)}/supports`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo),
    });
  } catch {
    estado.textContent = 'No se pudo registrar el apoyo. Revisa tu conexión e inténtalo de nuevo.';
    return;
  }
  let j = null;
  try { j = await r.json(); } catch { /* respuesta ilegible */ }
  if ((r.status === 201 || r.ok) && j?.ok && j.support) {
    const etiqueta = j.labels?.kind ?? KIND_LABEL[kind] ?? kind;
    const nota = j.labels?.note ?? 'Expresado. No es dinero recibido.';
    estado.textContent = `${etiqueta}: ${nota}`;
    form.reset();
    cargarResumen(id);
  } else if (r.status === 400) {
    estado.textContent = 'No se pudo registrar: ' + ((j && (j.detail || j.error)) || 'revisa los campos e inténtalo de nuevo.');
  } else if (r.status === 404) {
    estado.textContent = 'Esta iniciativa ya no admite apoyos.';
  } else {
    estado.textContent = 'No se pudo registrar el apoyo. Inténtalo de nuevo más tarde.';
  }
}
function montarApoyos(init) {
  const box = document.getElementById('apoyos');
  if (!box) return;
  const id = init.id;
  const modalidad = init.modality;
  if (modalidad !== 'donations' && modalidad !== 'both') {
    box.innerHTML = '<p class="nota">Esta iniciativa es un negocio: aquí no se registran apoyos ni simulaciones. Puedes conocerla, consultar sus productos o compartir su enlace.</p>';
    return;
  }
  box.innerHTML = `<p id="apoyos-resumen" role="status">Cargando resumen…</p>
    <div class="apoyos-grid">
      ${formularioApoyo('intent', 'Expresar intención de apoyo',
        'Una intención es solo un mensaje al dueño: no mueve dinero ni es un pago.',
        'Confirmo que esto es solo una intención, sin dinero.')}
      ${formularioApoyo('simulated', 'Simular donación',
        'Simulación de demostración: no mueve dinero real ni se recibe nada.',
        'Confirmo que esto es solo una simulación de demostración, sin dinero.')}
    </div>`;
  cargarResumen(id);
  for (const kind of ['intent', 'simulated']) {
    document.getElementById(`form-${kind}`).addEventListener('submit', (e) => {
      e.preventDefault();
      enviarApoyo(kind, id, e.target);
    });
  }
}
async function cargar() {
  const id = idDeRuta();
  if (!id) {
    main.innerHTML = '<h1>No se encontró la iniciativa</h1><p>El enlace no incluye un identificador válido. <a href="/#explorar">Volver a Explorar</a>.</p>';
    return;
  }
  let r;
  try {
    r = await fetch(`/api/initiatives/${encodeURIComponent(id)}`);
  } catch {
    main.innerHTML = '<h1>Sin conexión</h1><p>No se pudo cargar la iniciativa. Revisa tu conexión e inténtalo de nuevo.</p>';
    return;
  }
  if (r.status === 404) {
    main.innerHTML = '<h1>Esta iniciativa no existe</h1><p>No existe o dejó de estar publicada. <a href="/#explorar">Volver a Explorar</a>.</p>';
    return;
  }
  let data = null;
  try { data = await r.json(); } catch { /* respuesta ilegible */ }
  if (!r.ok || !data?.ok || !data?.initiative) {
    main.innerHTML = '<h1>No se pudo cargar la iniciativa</h1><p>Inténtalo de nuevo más tarde. <a href="/#explorar">Volver a Explorar</a>.</p>';
    return;
  }
  const init = { ...data.initiative, products: data.products }; // API: {initiative, products} hermanos
  document.title = `Porque — ${init.name ?? 'iniciativa'}`;
  main.innerHTML = vista(init);
  montarApoyos(init);
  const absUrl = (u) => new URL(u, location.origin).href;
  let shareUrl = absUrl('/i/' + init.id);
  let shareNote = 'Enlace local: válido solo en este entorno. No lo presentes como público.';
  let shareQr = null;
  try {
    const sr = await fetch(`/api/share/initiative/${encodeURIComponent(init.id)}`);
    const sj = await sr.json();
    if (sj?.ok && sj.share?.url) { shareUrl = absUrl(sj.share.url); shareNote = 'Dirección pública verificada.'; }
    else if (sj?.ok && sj.share?.localPath) { shareUrl = absUrl(sj.share.localPath); }
    if (sj?.ok && sj.share?.qr) shareQr = sj.share.qr;
  } catch { /* usa enlace local */ }
  // QR real si el endpoint lo trae;
  // si no, mensaje honesto con el motivo. El QR codifica SOLO la URL.
  if (shareQr?.available && shareQr.dataUrl) {
    document.getElementById('qr-box').innerHTML =
      `<img src="${shareQr.dataUrl}" alt="Código QR de la iniciativa">` +
      `<p><a id="btn-qr-descarga" class="boton" href="${shareQr.dataUrl}" download="qr-iniciativa-${encodeURIComponent(init.id)}.gif">Descargar QR</a></p>` +
      (shareQr.local ? '<p class="nota">QR del enlace local: válido solo en este entorno.</p>' : '');
  } else if (shareQr?.reason) {
    document.getElementById('qr-nota').textContent = 'QR no disponible: ' + shareQr.reason;
  }
  document.getElementById('url-canonica').textContent = shareNote + ' ' + shareUrl;
  document.getElementById('btn-copiar-url').addEventListener('click', async () => {
    const estado = document.getElementById('url-estado');
    const url = shareUrl;
    try {
      await navigator.clipboard.writeText(url);
      estado.textContent = 'Dirección copiada.';
    } catch {
      estado.textContent = 'No se pudo copiar. Dirección: ' + url;
    }
  });
}

let consultaId = null, consultaUrl = '';
main.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-consulta]');
  if (!b) return;
  let data = null;
  try {
    const r = await fetch('/api/inquiries', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ productId: b.dataset.consulta, channel: 'link', clientOpId: crypto.randomUUID() }) });
    data = await r.json();
  } catch { /* sin conexión */ }
  if (!data?.ok) return;
  consultaId = data.inquiry.id; consultaUrl = data.url;
  document.getElementById('consulta').hidden = false;
  document.getElementById('consulta-producto').textContent = `Consulta sobre: ${b.dataset.nombre}`;
  document.getElementById('consulta-estado').textContent = '';
  document.getElementById('consulta').scrollIntoView({ block: 'nearest' });
});
const absUrlConsulta = (u) => new URL(u, location.origin).href;
document.getElementById('btn-copiar').addEventListener('click', async () => {
  const estado = document.getElementById('consulta-estado');
  try {
    await navigator.clipboard.writeText(absUrlConsulta(consultaUrl));
    estado.textContent = 'Enlace copiado.';
  } catch {
    estado.textContent = 'No se pudo copiar. Enlace: ' + absUrlConsulta(consultaUrl);
  }
});
document.getElementById('btn-chat').addEventListener('click', async () => {
  const texto = encodeURIComponent(`Hola, me interesa: ${document.getElementById('consulta-producto').textContent} ${absUrlConsulta(consultaUrl)}`);
  window.open(WA_TEMPLATE.replace('{text}', texto), '_blank', 'noopener');
  try { await fetch(`/api/inquiries/${consultaId}/opened`, { method: 'POST' }); } catch { /* informativo */ }
  document.getElementById('consulta-estado').textContent = 'Chat abierto (no confirma envío ni respuesta).';
});

cargar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
